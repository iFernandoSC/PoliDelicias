<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../script.js" defer></script>
    <link rel="stylesheet" href="../style.css">
    <title>Polidelicias</title>
</head>
<body class="tortas">
    <header class="headertortas" id="header">
    <!-- Sección principal / Cabecera -->
        <button id="botonVolver"><</button>
        <h1>Tortas y sushi</h1>
    </header>

    
    <!-- Menú de la tienda -->
    <main  class="articulos">
        <article class="articulo" id="MenuTortaSushi1">MENU 1</article>

        <!-- Barra de navegación -->
        <section id="navtortas" class="menu">
            <a href="../index.html">Inicio</a>
            <a href="../lugares.html">Lugares</a>
        </section>
        
    </main>

    <!-- Sección de contacto de la página -->
    <footer>
        CONTACTO
    </footer>

        <!-- Script para ocultar la cabecera al hacer scroll hacia abajo -->
        <script>
            let ultimaPosicion = 0;

            const header = document.getElementById("header");

            window.addEventListener("scroll", () => {
            const posicionActual = window.scrollY;

            if (posicionActual > ultimaPosicion && posicionActual > 100) {
                header.classList.add("oculto");
            } else {
                header.classList.remove("oculto");
            }

            ultimaPosicion = posicionActual;
        });
        </script>
</body>
</html>
