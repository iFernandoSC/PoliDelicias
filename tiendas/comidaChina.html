    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Polidelicias</title>
</head>
<body class="comidachina">
    <!-- Sección principal / Cabecera -->
    <header class="headerchina" id="header">
        <button id="botonVolver"><</button>
        <h1>Comida <span>China</span> <img class="imgcorea" src="../img/corea.svg" alt="Bandera corea del sur"></h1>
    </header>

    <!-- Menú de la tienda -->
    <main  class="articulos">
        <article class="articulo" Id="MenuComidaChina1">MENU 1</article>
        <article class="articulo" id="MenuComidaChina2">MENU 2</article>
        <article class="articulo" id="OfertaComidaChina1">OFERTA 1</article>
        <article class="articulo" id="OfertaComidaChina2">OFERTA 2</article>

    </main>

    <!-- Sección de contacto de la página -->
    <footer>
        CONTACTO
    </footer>

            <!-- Script para ocultar la cabecera al hacer scroll hacia abajo -->
        <script>
            let ultimaPosicion = 0;

            const header = document.getElementById("header");

            window.addEventListener("scroll", () => {
            const posicionActual = window.scrollY;

            if (posicionActual > ultimaPosicion && posicionActual > 100) {
                header.classList.add("oculto");
            } else {
                header.classList.remove("oculto");
            }

            ultimaPosicion = posicionActual;
        });
        </script>
</body>
</html>
