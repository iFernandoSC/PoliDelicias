<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polidelicias - Mapa y Ubicación</title>
    
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="style.css">

    <style>
        /* Aseguramos que la página y el cuerpo ocupen toda la pantalla */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Contenedor del mapa con altura explícita para que se renderice */
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* 📍 Barra de navegación inferior fija */
        .menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(24, 24, 24, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .menu a {
            color: #bbb;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s;
        }
        .menu a:hover { color: #fff; }
        .menu a.actual { color: orange; }

        /* Panel flotante de geolocalización */
        .geo-panel {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: rgba(24, 24, 24, 0.72);
            border-radius: 12px;
            padding: 12px;
            width: 310px;
            max-width: calc(100vw - 28px);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .geo-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            background: orange;
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .geo-btn:hover { background: rgb(219, 142, 0); }
        .geo-btn.active { background: #16a34a; }
        .geo-status { font-size: 12px; color: white; line-height: 1.35; }

        /* Caja de coordenadas situada justo arriba del menú inferior */
        .coord-box {
            position: fixed;
            bottom: 48px; 
            left: 0;
            z-index: 950;
            background: rgba(242, 224, 179, 0.94);
            border-top: 1px solid #b89f65;
            border-right: 1px solid #b89f65;
            padding: 4px 10px;
            font-family: Consolas, monospace;
            font-size: 12.5px;
            font-weight: 600;
            color: #2b2b2b;
            border-top-right-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Contenedor principal del mapa -->
    <div id="map"></div>

    <!-- Panel de geolocalización -->
    <div class="geo-panel">
        <button type="button" class="geo-btn" id="btnLocate">📍 Usar mi ubicación</button>
        <p class="geo-status" id="geoStatus">Presiona el botón para pedir permiso y rastrear tu ubicación.</p>
    </div>

    <!-- Caja de visualización de coordenadas del cursor -->
    <div class="coord-box" id="coordBox">20.67205, -103.37380</div>

    <!-- Barra de navegación inferior -->
    <nav class="menu" id="menu">
        <a href="index.html">Inicio</a>
        <a href="lugares.html">Lugares</a>
        <a href="mapa.html" class="actual">Mapa</a>
    </nav>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Script del mapa -->
    <script>
        'use strict';
        (() => {
            const map = L.map('map', { center: [20.67205, -103.37380], zoom: 15, zoomControl: false });
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            const coordBox = document.getElementById('coordBox');
            const btnLocate = document.getElementById('btnLocate');
            const geoStatus = document.getElementById('geoStatus');
            
            let userMarker = null;
            let accuracyCircle = null;
            let watchId = null;

            // Petición a tu backend para traer los restaurantes de la base de datos y pintarlos
            fetch('https://polidelicias-backend.onrender.com/api/restaurantes')
                .then(res => res.json())
                .then(data => {
                    const listaRestaurantes = data.restaurantes || data;
                    if (!listaRestaurantes) return;

                    listaRestaurantes.forEach((lugar, index) => {
                        const direccionCompleta = (lugar.domicilio || lugar.direccion) + ", Guadalajara, Jalisco";
                        const urlGeo = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccionCompleta)}`;

                        setTimeout(() => {
                            fetch(urlGeo)
                                .then(r => r.json())
                                .then(geoData => {
                                    if (geoData && geoData.length > 0) {
                                        L.marker([parseFloat(geoData[0].lat), parseFloat(geoData[0].lon)])
                                            .addTo(map)
                                            .bindPopup(`
                                                <div style="font-family: sans-serif;">
                                                    <b style="font-size: 14px; color: #ea580c;">${lugar.nombre}</b><br>
                                                    <p style="margin: 4px 0; font-size: 12px; color: #333;">🍽️ <b>Tipo:</b> ${lugar.tipo_comida || 'General'}</p>
                                                    <p style="margin: 4px 0; font-size: 12px; color: #555;">📍 ${lugar.domicilio || lugar.direccion}</p>
                                                    <p style="margin: 4px 0; font-size: 11px; color: #666;">⏰ ${lugar.horario || 'No especificado'}</p>
                                                </div>
                                            `);
                                    }
                                })
                                .catch(err => console.error('Error al geocodificar:', err));
                        }, index * 600);
                    });
                })
                .catch(err => console.error('Error al obtener restaurantes:', err));

            // Actualizar coordenadas con el movimiento del cursor
            map.on('mousemove', (e) => {
                coordBox.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            });

            function onLocationDetected(coords) {
                const pos = [coords.latitude, coords.longitude];
                if (!userMarker) {
                    userMarker = L.marker(pos).addTo(map).bindPopup('📍 Mi ubicación actual').openPopup();
                    accuracyCircle = L.circle(pos, { radius: coords.accuracy, color: '#ea580c', fillOpacity: 0.15, weight: 1.5 }).addTo(map);
                    map.flyTo(pos, 16, { duration: 1.0 });
                } else {
                    userMarker.setLatLng(pos);
                    accuracyCircle.setLatLng(pos).setRadius(coords.accuracy);
                }
                coordBox.textContent = `${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`;
                geoStatus.textContent = `Lat: ${coords.latitude.toFixed(5)}, Lng: ${coords.longitude.toFixed(5)} (±${Math.round(coords.accuracy)} m)`;
            }

            function startTracking(highAccuracy = true, usedFallback = false) {
                if (!('geolocation' in navigator)) {
                    geoStatus.textContent = 'Tu navegador no soporta geolocalización.';
                    return;
                }
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                btnLocate.textContent = 'Solicitando permiso GPS...';
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        btnLocate.classList.add('active');
                        btnLocate.textContent = 'Rastreando ubicación (Detener)';
                        onLocationDetected(position.coords);
                    },
                    (err) => {
                        if (highAccuracy && !usedFallback && (err.code === 2 || err.code === 3)) {
                            startTracking(false, true);
                            return;
                        }
                        stopTracking();
                        const msgs = { 1: 'Permiso denegado.', 2: 'Señal no disponible.', 3: 'Tiempo agotado.' };
                        geoStatus.textContent = msgs[err.code] || 'Error de ubicación.';
                    },
                    { enableHighAccuracy: highAccuracy, maximumAge: highAccuracy ? 2000 : 15000, timeout: highAccuracy ? 10000 : 20000 }
                );
            }

            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                btnLocate.classList.remove('active');
                btnLocate.textContent = 'Usar mi ubicación';
            }

            btnLocate.addEventListener('click', () => {
                if (watchId !== null) {
                    stopTracking();
                    geoStatus.textContent = 'Rastreo detenido.';
                } else {
                    startTracking(true, false);
                }
            });
        })();
    </script>

    <!-- Tu archivo script.js general -->
    <script src="script.js"></script>
</body>
</html>
